<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alex Doe — Profile</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, #18243d 0%, #0a0a0a 45%, #050505 100%);
    color: #ffffff;
}

.hero {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 24px;
}

.card {
    width: min(760px, 100%);

    padding: 70px 60px;

    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.025)
        );

    backdrop-filter: blur(20px);

    box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

    text-align: center;

    animation: cardIn 0.8s ease forwards;
}

.eyebrow {
    font-size: 12px;

    letter-spacing: 5px;

    color: #7d8aa5;

    margin-bottom: 24px;

    text-transform: uppercase;
}

h1 {
    font-size: clamp(42px, 8vw, 80px);

    line-height: 1;

    margin-bottom: 26px;

    letter-spacing: -3px;
}

.description {
    max-width: 620px;

    margin: 0 auto 36px;

    color: #aeb7c9;

    font-size: 18px;

    line-height: 1.7;
}

button {
    border: 1px solid rgba(255, 255, 255, 0.18);

    padding: 14px 30px;

    border-radius: 999px;

    background: #ffffff;

    color: #050505;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

button:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 12px 35px rgba(255, 255, 255, 0.18);
}

button:active {
    transform: scale(0.98);
}

#message {
    min-height: 24px;

    margin-top: 24px;

    color: #8e9ab1;

    font-size: 14px;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 600px) {
    .card {
        padding: 45px 25px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 16px;
    }
}

    </style>
</head>

<body>

    <main class="hero">

        <div class="card">

            <p class="eyebrow">
                VEXORITE GENERATED
            </p>

            <h1>
                Alex Doe — Profile
            </h1>

            <p class="description">
                A clean, modern personal profile website with bio, skills, experience, and contact sections.
            </p>

            <button id="actionButton">
                Explore
            </button>

            <p id="message"></p>

        </div>

    </main>

    <script>
const button = document.getElementById("actionButton");
const message = document.getElementById("message");

if (button && message) {
    button.addEventListener("click", () => {
        message.textContent =
            "VEXORITE says: Website is working.";

        button.textContent = "WORKING ✓";
    });
}

    </script>

</body>
</html>
